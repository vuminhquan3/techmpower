<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TechMPower</title>
    <script type="text/javascript">
      // Simple redirect for SPA routing on GitHub Pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + l.pathname.split('/').indexOf('techmpower')).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(l.pathname.split('/').indexOf('techmpower') + 1).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
